# Minimal Promtail config shipping simulated service logs to Grafana
# Cloud's managed Loki instance, for the `fetch_logs` tool (agent/tools)
# to query via LogQL.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: "${GRAFANA_CLOUD_LOKI_PUSH_URL}"
    basic_auth:
      username: "${GRAFANA_CLOUD_LOKI_USERNAME}"
      password: "${GRAFANA_CLOUD_API_KEY}"

scrape_configs:
  - job_name: media-pipeline-services
    static_configs:
      - targets: ["localhost"]
        labels:
          job: media-pipeline
          __path__: /var/log/media-pipeline/*.log

# Minimal Prometheus config for the simulated media-studio infra.
# Scrapes the demo exporters/services that emit the metrics referenced by
# the dashboards in ../dashboards and the alert rules in ../alerting.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: render-workers
    static_configs:
      - targets: ["render-worker-01:9100", "render-worker-02:9100", "render-worker-03:9100"]

  - job_name: cdn-edge
    static_configs:
      - targets: ["cdn-edge-us:9100", "cdn-edge-eu:9100"]

  - job_name: license-check-svc
    static_configs:
      - targets: ["license-check-svc:9100"]

remote_write:
  # Push to Grafana Cloud's managed Prometheus (Mimir) instance.
  # Fill in from your Grafana Cloud stack's "Send metrics" details page.
  - url: "${GRAFANA_CLOUD_PROMETHEUS_REMOTE_WRITE_URL}"
    basic_auth:
      username: "${GRAFANA_CLOUD_PROMETHEUS_USERNAME}"
      password: "${GRAFANA_CLOUD_API_KEY}"
